name: Gerar APK Android

on:
  push:
    branches: [main, ccr-c1740926-hjldbw]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: apk
  cancel-in-progress: true

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21

      # O runner ubuntu-latest já vem com o Android SDK (ANDROID_HOME).
      - name: Verificar Android SDK
        run: |
          echo "ANDROID_HOME=$ANDROID_HOME"
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true

      - name: Instalar dependências
        run: npm ci

      - name: Compilar o app web
        run: npm run build

      - name: Copiar para o projeto Android
        run: npx cap sync android

      - name: Gerar APK
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon --stacktrace

      - name: Renomear APK
        run: cp android/app/build/outputs/apk/debug/app-debug.apk MyReader.apk

      - uses: actions/upload-artifact@v4
        with:
          name: MyReader-apk
          path: MyReader.apk

      - name: Publicar Release com o APK
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.${{ github.run_number }}
          target_commitish: ${{ github.sha }}
          name: MyReader 1.0.${{ github.run_number }} (Android)
          make_latest: true
          files: MyReader.apk
          body: |
            📱 **Baixe o `MyReader.apk` abaixo e instale no Android.**

            Na primeira vez o Android pede para permitir "instalar apps desta fonte" — é só autorizar.
            Novas versões instalam por cima, sem perder sua biblioteca.

            Link sempre da versão mais nova:
            https://github.com/${{ github.repository }}/releases/latest/download/MyReader.apk
