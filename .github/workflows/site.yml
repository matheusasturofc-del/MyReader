name: Atualizar site compilado (GitHub Pages)

# O GitHub Pages deste repositório publica direto a branch. O código-fonte precisa ser
# compilado, então este workflow gera a versão final na pasta app/ e faz commit dela.
on:
  push:
    branches: [main, ccr-c1740926-hjldbw]
    paths-ignore: ['app/**']
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: site
  cancel-in-progress: true

jobs:
  site:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
      - name: Copiar para app/ e fazer commit
        run: |
          rm -rf app
          cp -r dist app
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A app
          if git diff --cached --quiet; then echo "Sem mudanças"; exit 0; fi
          git commit -m "Atualiza site compilado (app/)"
          git pull --rebase origin "${GITHUB_REF_NAME}"
          git push origin "HEAD:${GITHUB_REF_NAME}"
